[package]
name = "pseud0-web-login-relay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "pseud0 web-login v1 Matrix relay"
publish = false
default-run = "pseud0-web-login-relay"

[lib]
name = "pseud0_web_login_relay"
path = "src/lib.rs"

[[bin]]
name = "pseud0-web-login-relay"
path = "src/main.rs"

[features]
default = ["matrix"]
matrix = ["dep:matrix-sdk"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
bs58 = "0.5"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
fs4 = "0.12"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
once_cell = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "0.26"
zeroize = { version = "1", features = ["derive"] }

matrix-sdk = { version = "0.14", default-features = false, optional = true, features = [
    "e2e-encryption",
    "sqlite",
    "bundled-sqlite",
    "rustls-tls",
] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Fat LTO + codegen-units=1 OOMs small VPS builders (rustc SIGKILL).
lto = "thin"
codegen-units = 16
strip = true
